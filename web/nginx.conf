map $http_x_real_ip $flamme_real_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

map $http_x_forwarded_proto $flamme_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

map $http_x_real_ip $flamme_limit_key {
    ""      $remote_addr;
    default $http_x_real_ip;
}

map $request_method $flamme_post_key {
    POST    $flamme_limit_key;
    default "";
}

limit_req_zone $flamme_post_key zone=flamme_register:10m rate=5r/m;
limit_req_zone $flamme_post_key zone=flamme_login:10m rate=10r/m;
limit_req_zone $flamme_post_key zone=flamme_refresh:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=30s;
    client_max_body_size 1m;
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    location = /register {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        limit_req zone=flamme_register burst=5 nodelay;
        limit_req_status 429;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/flamme-proxy.conf;
    }

    location = /login {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        limit_req zone=flamme_login burst=10 nodelay;
        limit_req_status 429;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/flamme-proxy.conf;
    }

    location = /refresh {
        limit_req zone=flamme_refresh burst=10 nodelay;
        limit_req_status 429;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/flamme-proxy.conf;
    }

    location /logout {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/flamme-proxy.conf;
    }

    location /dimensions {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/flamme-proxy.conf;
    }

    location /invites {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/flamme-proxy.conf;
    }

    location /songbooks {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/flamme-proxy.conf;
    }

    location /catalog {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        include /etc/nginx/flamme-proxy.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

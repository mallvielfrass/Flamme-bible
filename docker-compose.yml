services:
  db:
    # PostgreSQL 16 с расширением vector. Для другого мажора нужен образ pgvector той же версии.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flammebible}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-flammebible}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flammebible}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-flammebible}?sslmode=disable
      ADDR: ":8080"
      SESSION_TTL: ${SESSION_TTL:-720h}
      MEDIA_DIR: /data/media
      RELEASES_DIR: /data/releases
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      TRUST_PROXY: "1"
      EMBED_URL: http://embed:80/embed
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-small}
    volumes:
      - media:/data/media
      - releases:/data/releases
    depends_on:
      db:
        condition: service_healthy
      embed:
        condition: service_started
    restart: unless-stopped

  embed:
    # Локальная модель на CPU. Первый запуск скачивает веса, дальше они лежат в томе.
    # Поиск по смыслу ходит только сюда. Для aarch64 замените тег на cpu-arm64-1.9.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    command:
      - --model-id
      - ${EMBED_MODEL:-intfloat/multilingual-e5-small}
      - --dtype
      - float32
      # e5 усредняет токены. Без этого файла TEI для BERT берёт CLS, и поиск портится.
      - --pooling
      - mean
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
      - embedcache:/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  media:
  releases:
  embedcache:
